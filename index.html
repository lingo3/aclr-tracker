<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1764c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ACL Tracker">
<meta name="robots" content="noindex">
<title>ACL Power-Up Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
img { max-width: 100% }
/* Layout: one phone-width column; a post-op-day header, tab strip, then a time-ordered checklist. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #14202b; --muted: #5b6875; --line: #dde3e9;
  --accent: #1764c4; --accent-ink: #ffffff; --accent-soft: #e3eefb;
  --meds: #7a4cc2; --ice: #0b8fb3; --dressing: #b7791f; --exercise: #2f8a4c; --appt: #c2410c; --other: #64748b;
  --warn: #c2410c; --good: #2f8a4c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e151c; --surface: #16202a; --ink: #e6edf3; --muted: #93a2b1; --line: #263442;
  --accent: #5ea2f2; --accent-ink: #0b1622; --accent-soft: #1a2c42;
  --meds: #b196ea; --ice: #4cc3e2; --dressing: #e3a94b; --exercise: #62c483; --appt: #f08a5d; --other: #9aa8b8;
  --warn: #f08a5d; --good: #62c483; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #16202a; --ink: #e6edf3; --muted: #93a2b1; --line: #263442;
  --accent: #5ea2f2; --accent-ink: #0b1622; --accent-soft: #1a2c42;
  --meds: #b196ea; --ice: #4cc3e2; --dressing: #e3a94b; --exercise: #62c483; --appt: #f08a5d; --other: #9aa8b8;
  --warn: #f08a5d; --good: #62c483; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }

header.top { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: center }
.pod { grid-row: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 92px; height: 92px; border-radius: 50%; background: var(--accent); color: var(--accent-ink) }
.pod b { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1 }
.pod span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700 }
header.top h1 { font-size: clamp(22px, 5vw, 28px); font-weight: 800 }
.sub { color: var(--muted); font-size: 14px }
.banner { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px }
.banner input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

.daybar { display: flex; align-items: center; gap: 8px; justify-content: space-between }
.daybar .d { text-align: center; flex: 1 }
.daybar .d strong { font-family: var(--display); font-size: 18px; display: block }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 40px; font-size: 18px }
.progress { display: flex; flex-direction: column; gap: 6px }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
.next { font-size: 14px; color: var(--muted) }
.next b { color: var(--ink) }

.filters { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px }
.chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 700 }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--other)); flex: none }

ol.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
ol.list li { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); position: relative }
ol.list li:first-child { border-top: 0 }
ol.list li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c) }
ol.list li.late .time { color: var(--warn); font-weight: 600 }
ol.list li.done .what { opacity: .55 }
ol.list li.done .what strong { text-decoration: line-through }
.time { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap }
.what { min-width: 0 }
.what strong { display: block }
.what small { color: var(--muted); display: block; font-size: 13px }
.what .stamp { color: var(--good); font-size: 12px; font-family: var(--mono) }
.check { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center }
.check svg { width: 22px; height: 22px; stroke: var(--accent-ink); stroke-width: 3; fill: none; opacity: 0 }
li.done .check { background: var(--good); border-color: var(--good) }
li.done .check svg { opacity: 1 }
.empty { padding: 24px; text-align: center; color: var(--muted) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field input, .field select, .field textarea { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: 100% }
.field textarea { min-height: 70px; resize: vertical }
.pain { display: flex; gap: 4px; flex-wrap: wrap }
.pain button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono) }
.pain button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.hint { font-size: 13px; color: var(--muted) }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 700 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--warn) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }

.plan h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; margin-top: 4px }
.ptask { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line) }
.ptask:first-of-type { border-top: 0 }
.ptask div { min-width: 0 }
.ptask small { display: block; color: var(--muted); font-size: 13px }
.timesbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.timesbox span { background: var(--accent-soft); border-radius: 6px; padding: 3px 4px 3px 8px; font-family: var(--mono); font-size: 13px; display: inline-flex; gap: 4px; align-items: center }
.timesbox span button { border: 0; background: none; padding: 0 4px; color: var(--muted) }
.dows { display: flex; gap: 4px; flex-wrap: wrap }
.dows label { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px }

.chartbox { overflow-x: auto }
.chartbox svg { display: block; width: 100%; height: auto }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px }
table.hist th, table.hist td { text-align: right; padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap }
table.hist th:first-child, table.hist td:first-child { text-align: left }
table.hist thead th { border-top: 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em }
.tablewrap { overflow-x: auto }
.timerbtn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px }
.timerbtn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; fill: none }
#timer { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }
#timer .tw { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
#timer .thead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px }
#timer .thead h2 { font-size: 20px }
#timer .ring { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 4px auto 0 }
#timer .ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
#timer .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center }
#timer .tphase { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--tc) }
#timer .count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 64px; font-weight: 600; line-height: 1.05 }
#timer .count.long { font-size: 52px }
#timer .meta { display: flex; justify-content: center; gap: 24px; font-family: var(--mono); font-size: 15px; color: var(--muted) }
#timer .meta b { color: var(--ink); font-size: 22px; display: block; text-align: center }
#timer .ctl { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap }
#timer .ctl .btn { min-height: 52px; min-width: 104px; font-size: 17px }
#timer .tgrid { align-items: end; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px }
#timer .tgrid input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-family: var(--mono); font-size: 18px }
#timer .sum { font-size: 15px; color: var(--muted) }
.status { font-size: 12px; color: var(--muted); text-align: center }
.phase { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px }
.phase h2 { font-size: 17px }
.phase p { margin: 0; font-size: 14px }
.sechead { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin: 6px 2px -6px }
.sechead h2 { font-size: 17px; display: flex; align-items: center; gap: 8px }
.sechead .num { font-size: 13px; color: var(--muted) }
.what .cond { color: var(--warn); font-size: 13px; display: block }
.what details { font-size: 13px; color: var(--muted) }
.what details summary { cursor: pointer; width: fit-content }
.what .carry { color: var(--warn); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em }
.dose { min-width: 76px; height: 44px; border-radius: 10px; border: 2px solid var(--meds); background: var(--bg); font-weight: 700; color: var(--meds); padding: 0 10px }
.dose:disabled { opacity: .5 }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; font-size: 13px }
ul.notes { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted) }
.qcard textarea { min-height: 56px }
details.carrybox > summary { list-style: none; cursor: pointer }
details.carrybox > summary::-webkit-details-marker { display: none }
details.carrybox > summary h2::after { content: " ▸"; color: var(--muted) }
details.carrybox[open] > summary h2::after { content: " ▾" }
[hidden] { display: none !important }
ol.list li.g { grid-template-columns: minmax(0,1fr) }
ol.list li.nt { grid-template-columns: minmax(0,1fr) auto }
.what small.d { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.tbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: 13px }
.tbtn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 3; fill: none; opacity: .25 }
.tbtn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--accent-ink) }
.tbtn[aria-pressed="true"] svg { opacity: 1 }
.tbtn.late { border-color: var(--warn); color: var(--warn) }
.disclaimer { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px }
#sync { font-size: 12px; color: var(--muted); grid-column: 2 }
header.top .pod { grid-row: span 3 }
.mrow { flex-wrap: wrap; align-items: center }
.mrow strong { overflow-wrap: anywhere }
.mrow select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.btn { white-space: nowrap }
#sync[data-state="offline-pending"], #sync[data-state="offline"] { color: var(--warn); font-weight: 700 }
</style>
</head>
<body>
<div class="wrap" id="gate" hidden></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="pod" aria-label="Post-op day"><span>Day</span><b class="num" id="podNum">–</b><span id="podWeek">post-op</span></div>
    <h1>ACL Power-Up Tracker</h1>
    <div class="sub" id="headSub">Loading your plan…</div>
    <div id="sync" role="status"></div>
  </header>
  <div class="banner" id="setup" hidden>
    <span>Set your surgery date so the plan lines up with your post-op days.</span>
    <input type="date" id="setupDate" aria-label="Surgery date">
    <button class="btn primary" id="setupSave">Save date</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="log" aria-selected="false">Daily log</button>
    <button role="tab" data-tab="questions" aria-selected="false">Questions</button>
    <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
    <button role="tab" data-tab="history" aria-selected="false">Progress</button>
  </nav>
  <main id="view"></main>
  <div class="status" id="status"></div>
</div>
<div id="timer" role="dialog" aria-modal="true" aria-label="Exercise timer" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
const CATS = {
  meds: { label: "Medication", c: "var(--meds)" },
  ice: { label: "Ice / cold therapy", c: "var(--ice)" },
  dressing: { label: "Wound & dressing", c: "var(--dressing)" },
  exercise: { label: "Home exercises", c: "var(--exercise)" },
  appt: { label: "Appointments", c: "var(--appt)" },
  other: { label: "Brace, elevation & other", c: "var(--other)" },
};
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const uid = () => Math.random().toString(36).slice(2, 9);

// Surgeon's protocol, pharmacy labels and open questions, from the approved review spreadsheet
// (aclr-surgeon-protocol-events.xlsx). Day offsets are post-op days: 0 = surgery day.
let PROTOCOL = { items: [], phases: [], preGoals: "", info: [], questions: [], postOpVisit: 11 };   // the surgeon's protocol loads after sign-in (kept out of the public page)
const SURGERY_DEFAULT = "2026-11-13", POSTOP_VISIT = "2026-11-24";
const SECS = {
  event: { label: "Events & appointments", c: "var(--appt)" },
  med: { label: "Medications", c: "var(--meds)" },
  routine: { label: "Daily routines", c: "var(--exercise)" },
  goal: { label: "Goals & criteria", c: "var(--ice)" },
  question: { label: "Questions to ask", c: "var(--dressing)" },
  custom: { label: "My tasks", c: "var(--other)" },
};
// Your own tasks (e.g. PT sessions once booked). The protocol items above are fixed.
function starterPlan() {
  return { surgeryDate: SURGERY_DEFAULT, side: "Left", v2: true, tasks: [
    { id: uid(), cat: "appt", name: "Physical therapy session", detail: "2x/week for 12 weeks; formal PT can start 1-2 weeks after surgery. Edit the days and time once PT is booked.", times: [], freq: "days", dow: [2,4], date: "", startDay: 7, endDay: 91 },
  ] };
}
// ---------- dates ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const todayStr = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDay = s => parseYmd(s).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const fmtHM = hm => { const [h,m] = hm.split(":").map(Number); const d = new Date(); d.setHours(h, m); return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };

// ---------- state ----------
let plan = starterPlan();
const days = {};           // "YYYY-MM-DD" -> { done: {key: iso}, pain, swelling, flex, ext, note }
let carryOpen = false;
let tab = "today", sel = todayStr(), filter = null, editing = null, confirmReset = false;
let draft = { knee: "op", motion: "flex", method: "app", value: "", thigh: "", shin: "" };
let photo = null;          // { img, pts: [[x,y],...] } held in memory only; photos are never saved
let store = null;          // { mode: "cloud"|"local", saveDoc(name, data), loadAll() }

const pod = d => plan.surgeryDate ? diffDays(d, plan.surgeryDate) : null;
function activeOn(task, d) {
  if (task.freq === "once") return task.date === d;
  const p = pod(d);
  if (p !== null) {
    if (p < (task.startDay ?? 0)) return false;
    if (task.endDay !== null && task.endDay !== "" && p > task.endDay) return false;
  }
  if (task.freq === "days") return task.dow.includes(parseYmd(d).getDay());
  return true;
}
function occurrences(d) {
  const out = [];
  for (const t of plan.tasks) if (activeOn(t, d)) for (const hm of (t.times.length ? t.times : ["—"])) out.push({ t, hm, key: `${t.id}@${hm}` });
  return out.sort((a, b) => a.hm.localeCompare(b.hm) || a.t.name.localeCompare(b.t.name));
}
const dayDoc = d => (days[d] ||= { done: {} });
const checks = { done: {}, answers: {} };   // one-time items (events, goals, questions): checked once, for good
const isDone = id => checks.done[id] || (PROTOCOL.items.find(i => i.id === id)?.predone ? "pre" : null);
const inWin = (it, p) => p >= it.start && (it.end == null ? (it.persist ? true : p === it.start) : p <= it.end);
const qStart = q => q.askBy - 7;

// Everything for one day, grouped by section. Day-scoped keys ("d:") are per day; global keys ("g:") are once.
function dayItems(d) {
  const p = pod(d), out = { event: [], med: [], prn: [], routine: [], goal: [], question: [], custom: [], carry: [], info: [] };
  if (p === null) return out;
  const isToday = d === todayStr();
  for (const it of PROTOCOL.items) {
    if (it.sec === "med" || it.sec === "routine") {
      if (p < it.start || (it.end != null && p > it.end)) continue;
      if (it.dow && !it.dow.includes(parseYmd(d).getDay())) continue;
      if (it.prn) { out.prn.push(it); continue; }
      let times = it.times.length ? it.times : ["—"];
      if (p === 0 && it.postop) times = times.filter(t => t === "—" || t >= "15:00");
      if (it.skip?.[p]) times = times.filter(t => !it.skip[p].includes(t));
      for (const hm of times) out[it.sec].push({ it, hm, key: `d:${it.id}@${hm}` });
    } else {
      if (inWin(it, p)) out[it.sec].push({ it, hm: "—", key: `g:${it.id}` });
      else if (isToday && !isDone(it.id) && p > (it.end ?? it.start) && p - (it.end ?? it.start) <= 14 && !it.persist) out.carry.push({ it, hm: "—", key: `g:${it.id}`, sec: it.sec });
    }
  }
  for (const q of PROTOCOL.questions) {
    if (q.askBy == null) continue;
    const it = { ...q, sec: "question", detail: `${q.when} · Ask: ${q.who}`, cond: "" };
    if (p >= qStart(q) && p <= q.askBy) out.question.push({ it, hm: "—", key: `g:${q.id}` });

}
function prnHtml(it, d) {
  const log = (days[d]?.prn?.[it.id]) || [], last = log.length ? log[log.length - 1] : null;

function groupBy(list) {
  const m = new Map(); for (const o of list) { const id = o.it.id; if (!m.has(id)) m.set(id, []); m.get(id).push(o); }
  return [...m.values()].sort((a, b) => (a[0].hm === "—" ? "00" : a[0].hm).localeCompare(b[0].hm === "—" ? "00" : b[0].hm));
}
function viewToday() {
  const p = pod(sel), di = dayItems(sel), all = checkable(di);

const METHODS = { pt: "PT goniometer", app: "Phone goniometer app", incl: "Phone inclinometer", photo: "Photo, measured here" };
const KNEES = { op: "Operated knee", other: "Other knee" };
function rom(d, knee) {
  if (!d) return { flex: null, ext: null };
  const rs = (d.readings || []).filter(r => r.knee === knee);
  const fl = rs.filter(r => r.motion === "flex").map(r => r.value), ex = rs.filter(r => r.motion === "ext").map(r => r.value);
  return {
    flex: fl.length ? Math.max(...fl) : knee === "op" ? d.flex ?? null : null,
    ext: ex.length ? Math.min(...ex) : knee === "op" ? d.ext ?? null : null,
  };
}
const inclValue = () => (draft.thigh === "" || draft.shin === "") ? null : Math.round(Number(draft.thigh) + Number(draft.shin));
const deg = v => v == null ? "–" : `${v}°`;
const heelDeg = cm => cm == null || cm === "" ? "" : `≈ ${Math.round(Number(cm))}° short of straight`;

function measureInputs() {

      <label class="field"><span class="label">Shin tilt (°)</span><input id="dShin" type="number" inputmode="decimal" value="${esc(draft.shin)}" placeholder="e.g. 55"></label>

    </div>`;
  if (draft.method === "photo") return `
    <p class="hint">Take a side-on photo with the camera level with the knee. Then tap the <b>hip</b> (greater trochanter), the <b>knee</b> (outer knee bump), and the <b>ankle</b> (outer ankle bone), in that order. The photo stays on your device and isn't saved.</p>

    <label class="field"><span class="label">Knee angle (°)</span><input id="dValue" type="number" inputmode="decimal" value="${esc(draft.value)}" placeholder="Fills in from the photo"></label>`;
  return `<label class="field"><span class="label">${draft.motion === "flex" ? "Flexion (°)" : "Extension (°)"}</span>
    <input id="dValue" type="number" inputmode="decimal" value="${esc(draft.value)}" placeholder="${draft.motion === "flex" ? "e.g. 95" : "0 = straight"}"></label>`;

function drawPhoto() {
  const c = $("photoCanvas"); if (!c || !photo) return;
  const { img, pts } = photo; c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext("2d"), u = Math.max(c.width, c.height) / 300;
  g.drawImage(img, 0, 0);
  const css = getComputedStyle(document.documentElement), acc = css.getPropertyValue("--accent").trim() || "#1764c4";
  g.lineWidth = 2.5 * u; g.strokeStyle = acc; g.fillStyle = acc;
  if (pts.length > 1) { g.beginPath(); g.moveTo(...pts[0]); pts.slice(1).forEach(p => g.lineTo(...p)); g.stroke(); }
  pts.forEach(p => { g.beginPath(); g.arc(p[0], p[1], 5 * u, 0, 7); g.fill(); g.lineWidth = 1.5 * u; g.strokeStyle = "#fff"; g.stroke(); g.strokeStyle = acc; g.lineWidth = 2.5 * u; });
  if (pts.length === 3) {
    const a = photoAngle(); g.font = `bold ${16 * u}px sans-serif`; g.lineWidth = 4 * u; g.strokeStyle = "#000";
    const t = `${a}°`; g.strokeText(t, pts[1][0] + 10 * u, pts[1][1] - 10 * u); g.fillStyle = "#fff"; g.fillText(t, pts[1][0] + 10 * u, pts[1][1] - 10 * u);
  }
}
function photoAngle() {
  const [h, k, a] = photo.pts, v1 = [h[0]-k[0], h[1]-k[1]], v2 = [a[0]-k[0], a[1]-k[1]];
  const cos = (v1[0]*v2[0] + v1[1]*v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2));
  return Math.round(180 - Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI);
}

function describe(t) {

}

function drawTimer() {

  const el = $("timer"), c = T.cfg, it = T.it, color = SECS.routine.c;
  const head = `<div class="thead"><div><span class="label">Timer</span><h2>${esc(it.title)}</h2></div><button class="btn" data-tact="close">${T.state === "run" ? "Stop" : "Close"}</button></div>`;
  if (T.state === "setup") {
    const pre = TIMER_PRESETS[T.id], custom = !!plan.timers?.[T.id];
    el.innerHTML = `<div class="tw">${head}
      <div class="card"><div><span class="label">Protocol dose</span><div>${esc([it.freq, it.detail?.includes(" · ") ? it.detail.split(" · ")[0] : ""].filter(Boolean).join(" · "))}</div>${pre.ns ? `<small class="hint" style="color:var(--warn)">${esc(pre.ns)}. Check with PT and adjust.</small>` : ""}</div>
      ${timerFields(c)}
      <div class="sum" id="tsum">${c.sets} set${c.sets > 1 ? "s" : ""} of ${c.reps} rep${c.reps > 1 ? "s" : ""} · about ${durTxt(totalSecs(c))} total</div>
      <p class="hint" style="margin:0">Changes are saved for everyone who uses this tracker.${custom ? ` <button class="linkbtn" data-tact="reset">Back to the protocol preset</button>` : ""}</p></div>
      <div class="ctl"><button class="btn primary" data-tact="start">Start</button></div>
      <p class="hint" style="margin:0;text-align:center">Turn the sound up. The phone beeps and vibrates at each change and counts down the last 3 seconds.</p></div>`;
    return;
  }
  if (T.state === "done") {
    const occ = T.key && T.key.startsWith("d:") ? T.key : null, already = occ && dayDoc(todayStr()).done[occ.slice(2)];
    el.innerHTML = `<div class="tw">${head}<div class="card" style="text-align:center;align-items:center"><div class="tphase" style="--tc:var(--good);font-family:var(--display);font-size:30px;font-weight:800;color:var(--good)">All done</div>
      <div>${c.sets} set${c.sets > 1 ? "s" : ""} of ${c.reps} rep${c.reps > 1 ? "s" : ""} finished.</div>
      <div class="ctl">${occ && !already ? `<button class="btn primary" data-tact="markdone">Check it off for ${occ.includes("@") && occ.split("@")[1] !== "—" ? fmtHM(occ.split("@")[1]) : "today"}</button>` : already ? `<span class="hint">Already checked off.</span>` : ""}<button class="btn" data-tact="again">Run again</button></div></div></div>`;
    return;
  }
  const st = T.steps[T.i], left = T.paused ? T.left : (T.end - Date.now()) / 1000;
  const holds = T.steps.filter(x => x.kind === "hold").length, doneHolds = T.steps.slice(0, T.i).filter(x => x.kind === "hold").length;
  const tc = st.kind === "hold" ? color : st.kind === "ready" ? "var(--muted)" : "var(--accent)";
  const C = 2 * Math.PI * 54, next = T.steps[T.i + 1];
  el.innerHTML = `<div class="tw">${head}
    <div class="ring" style="--tc:${tc}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="8"/>
      <circle class="prog" cx="60" cy="60" r="54" fill="none" stroke="${tc}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.max(0, left) / st.dur)}"/></svg>
      <div class="mid" aria-live="polite"><div class="tphase">${esc(st.label)}</div><div class="count ${left >= 600 ? "long" : ""}">${mmss(left)}</div>${T.paused ? `<div class="label">Paused</div>` : ""}</div></div>
    <div class="meta"><div><b>${st.set}/${c.sets}</b>set</div><div><b>${st.kind === "ready" ? 0 : st.rep}/${c.reps}</b>rep</div><div><b>${Math.round(100 * doneHolds / holds)}%</b>done</div></div>
    <div class="ctl"><button class="btn primary" data-tact="${T.paused ? "resume" : "pause"}">${T.paused ? "Resume" : "Pause"}</button><button class="btn" data-tact="skip">Skip ›</button></div>
    ${next ? `<p class="hint" style="text-align:center;margin:0">Next: ${esc(next.label)} ${durTxt(next.dur)}</p>` : ""}</div>`;
}
function readTimerFields() {
  const c = { ...T.cfg };
  $("timer").querySelectorAll("[data-tf]").forEach(inp => { const k = inp.dataset.tf, v = Math.round(Number(inp.value) * Number(inp.dataset.unit || 1));
    if (Number.isFinite(v)) c[k] = Math.max(k === "rest" || k === "setRest" ? 0 : 1, v); });
  return c;
}
$("timer").addEventListener("input", e => { if (!T || T.state !== "setup" || !e.target.dataset.tf) return; const c = readTimerFields(), s = $("tsum");
  if (s) s.textContent = `${c.sets} set${c.sets > 1 ? "s" : ""} of ${c.reps} rep${c.reps > 1 ? "s" : ""} · about ${durTxt(totalSecs(c))} total`; });
$("timer").addEventListener("keydown", e => { if (e.key === "Escape" && T?.state !== "run") closeTimer(); });
$("timer").addEventListener("click", e => {
  const b = e.target.closest("[data-tact]"); if (!b || !T) return; const a = b.dataset.tact;
  if (a === "close") return closeTimer();
  if (a === "reset") { if (plan.timers) { delete plan.timers[T.id]; savePlan(); } T.cfg = timerCfg(T.id); return drawTimer(); }
  if (a === "start") {
    const c = readTimerFields(), pre = { ...T_DEFAULT, ...TIMER_PRESETS[T.id] }, diff = {};
    for (const k of ["sets", "reps", "hold", "rest", "setRest"]) if (c[k] !== pre[k]) diff[k] = c[k];
    const had = JSON.stringify(plan.timers?.[T.id] || {}), now = JSON.stringify(diff);
    if (had !== now) { plan.timers ||= {}; if (Object.keys(diff).length) plan.timers[T.id] = diff; else delete plan.timers[T.id]; savePlan(); }
    T.cfg = c; beep(1, 1); return runTimer();
  }
  if (a === "pause") { T.paused = true; T.left = (T.end - Date.now()) / 1000; keepAwake(false); return drawTimer(); }
  if (a === "resume") { T.paused = false; T.end = Date.now() + T.left * 1000; keepAwake(true); return drawTimer(); }
  if (a === "skip") { if (T.paused) { T.paused = false; } T.end = Date.now(); return tickTimer(); }
  if (a === "again") { T.state = "setup"; return drawTimer(); }
  if (a === "markdone") { const k = T.key.slice(2), dd = dayDoc(todayStr()); if (!dd.done[k]) { dd.done[k] = new Date().toISOString(); saveDay(todayStr()); } setStatus("Checked off"); return closeTimer(); }
});
// Roll the "today" view over at midnight and refresh overdue markers.
setInterval(() => { if (!editing && tab !== "questions" && document.activeElement?.tagName !== "TEXTAREA" && document.activeElement?.tagName !== "INPUT") render(); }, 60000);

function applyData(data, replace) {
  if (!data) return;
  if (data.protocol?.items) { PROTOCOL = data.protocol; if (PROTOCOL.title) { document.title = PROTOCOL.title; document.querySelector("header.top h1").textContent = PROTOCOL.title; } }
  if (data.plan) plan = data.plan;
  if (data.days) { if (replace) for (const k of Object.keys(days)) if (!(k in data.days)) delete days[k]; Object.assign(days, data.days); }
  if (data.checks) { if (replace) { checks.done = {}; checks.answers = {}; } Object.assign(checks.done, data.checks.done || {}); Object.assign(checks.answers, data.checks.answers || {}); }
}
// ---------- boot ----------
let booting = false;
async function boot() {
  if (booting || me) return; booting = true;
  try { await bootInner(); } finally { booting = false; }
}
async function bootInner() {
  if (!sb) { signInScreen("Can't reach the sign-in service. Check your connection and reload the page."); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { signInScreen(); return; }
  if (RECOVERY && !recoveryDone) { setPasswordScreen(); return; }
  const email = (session.user.email || "").toLowerCase();
  const role = await loadRole(email);
  if (!role) { notListedScreen(email); return; }
  me = { email, role };
  if (location.hash.includes("access_token")) history.replaceState(null, "", location.pathname);
  document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false;
  store = onlineStore();
  render();
  try {
    const data = await store.loadAll();
    applyData(data);
    if (!plan.v2 && canEdit()) {
      const STARTER = ["Pain medication","Other prescribed medication","Ice / cold therapy","Check incisions and dressing","Ankle pumps","Quad sets","Heel slides","Straight leg raises","Elevate leg","Physical therapy session"];
      const keepOwn = plan.template === false ? (plan.tasks || []).filter(t => !STARTER.includes(t.name)) : [];
      plan = { ...starterPlan(), surgeryDate: plan.surgeryDate || SURGERY_DEFAULT, side: plan.side || "Left" };
      plan.tasks.push(...keepOwn);
      savePlan();
    }
  } catch (e) { setStatus("Couldn't load saved data: " + (e?.message || "unknown error")); }
  render(); renderSync();
  store.subscribe(data => {   // live updates from other phones
    applyData(data, true);
    const t = document.activeElement?.tagName;
    if (!editing && t !== "TEXTAREA" && t !== "INPUT" && t !== "SELECT") render();
  });
}
sb?.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !me) boot(); if (ev === "SIGNED_OUT" && me) location.reload(); });
boot();
})();
</script>
